name: Build EclipseClient (Fabric 1.21.11)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: .

