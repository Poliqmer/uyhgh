            tar xzf /tmp/payload.tgz
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src build.gradle settings.gradle gradle.properties LICENSE .gitignore README.md
            if ! git diff --cached --quiet; then
              git commit -m "Przywroc zrodla (src) pominiete przy uploadzie"
              git push || echo "push skipped"
            fi
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Regenerate Gradle wrapper if the JAR is missing
        shell: bash
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar missing - regenerating"
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x ./gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Clean, compile, and verify the mod JAR
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Verify expected JAR exists
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/EclipseClient-1.21.11.jar"
          test -s "$JAR"
          echo "Built: $JAR"
          ls -lh "$JAR"
          echo "### Build output" >> "$GITHUB_STEP_SUMMARY"
          echo "- JAR: \`$JAR\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: $(stat -c%s "$JAR") bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Print mod metadata
        run: |
          unzip -p build/libs/EclipseClient-1.21.11.jar fabric.mod.json
          echo

      - name: Upload ready-to-download JAR
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-1.21.11
          path: build/libs/EclipseClient-1.21.11.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EclipseClient-build-diagnostics
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
